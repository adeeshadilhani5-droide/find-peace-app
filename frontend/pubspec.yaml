name: find_peace
description: "A serene, modern mindfulness and meditation mobile application built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  table_calendar: ^3.0.9
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
